<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body.light-mode {
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            color: #1f1f1f;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #1f1f1f, #2c2c2c);
            color: #f0f0f0;
        }

        .register-card {
            padding: 40px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: background-color 0.3s, color 0.3s;
        }

        body.light-mode .register-card {
            background-color: #ffffff;
            color: #1f1f1f;
        }

        body.dark-mode .register-card {
            background-color: #2c2c2c;
            color: #f0f0f0;
        }

        .register-card h2 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .btn-register-submit {
            width: 100%;
            padding: 12px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        body.light-mode .btn-register-submit {
            background-color: #ff9900;
            color: #fff;
        }

        body.light-mode .btn-register-submit:hover {
            background-color: #ffcc00;
            color: #1f1f1f;
        }

        body.dark-mode .btn-register-submit {
            background-color: #ffcc00;
            color: #1f1f1f;
        }

        body.dark-mode .btn-register-submit:hover {
            background-color: #e6b800;
        }

        .btn-login-link {
            width: 100%;
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            text-align: center;
            display: block;
            margin-top: 10px;
            transition: 0.3s;
            text-decoration: none;
        }

        body.light-mode .btn-login-link {
            background-color: #f0f0f0;
            color: #ff9900;
            border: 2px solid #ff9900;
        }

        body.light-mode .btn-login-link:hover {
            background-color: #ff9900;
            color: #fff;
        }

        body.dark-mode .btn-login-link {
            background-color: #3a3a3a;
            color: #ffcc00;
            border: 2px solid #ffcc00;
        }

        body.dark-mode .btn-login-link:hover {
            background-color: #ffcc00;
            color: #1f1f1f;
        }

        .text-danger {
            text-align: center;
            margin-top: 10px;
        }

        .dark-mode-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 12px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        body.light-mode .dark-mode-toggle {
            background-color: #ff9900;
            color: #fff;
        }

        body.light-mode .dark-mode-toggle:hover {
            background-color: #ffcc00;
            color: #1f1f1f;
        }

        body.dark-mode .dark-mode-toggle {
            background-color: #ffcc00;
            color: #1f1f1f;
        }

        body.dark-mode .dark-mode-toggle:hover {
            background-color: #e6b800;
        }
    </style>
</head>
<body id="body">

<!-- Toggle Dark Mode -->
<button class="dark-mode-toggle" onclick="toggleDarkMode()">🌙 Toggle Dark Mode</button>

<div class="register-card">
    <h2>Create Account</h2>

    <form th:action="@{/register}" th:object="${user}" method="post">
        <div class="mb-3">
            <input type="text" th:field="*{username}" placeholder="Username" class="form-control" required>
        </div>

        <div class="mb-3">
            <input type="password" th:field="*{password}" placeholder="Password" class="form-control" required>
        </div>

        <p class="text-danger" th:text="${error}"></p>

        <button type="submit" class="btn-register-submit">Register</button>
    </form>

    <a href="/login" class="btn-login-link">Already have an account? Login</a>
</div>

<script>
    const body = document.getElementById('body');


    if(localStorage.getItem('darkMode') === 'true') {
        body.classList.add('dark-mode');
    } else {
        body.classList.add('light-mode');
    }

    function toggleDarkMode() {
        if(body.classList.contains('dark-mode')) {
            body.classList.remove('dark-mode');
            body.classList.add('light-mode');
            localStorage.setItem('darkMode', 'false');
        } else {
            body.classList.remove('light-mode');
            body.classList.add('dark-mode');
            localStorage.setItem('darkMode', 'true');
        }
    }
</script>

</body>
</html>
