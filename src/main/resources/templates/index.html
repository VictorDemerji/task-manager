<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task Manager Board</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body id="body">

<button class="dark-mode-toggle btn btn-warning" onclick="toggleDarkMode()">🌙 Toggle Dark Mode</button>

<div class="container mt-5">

    <h1 class="text-center mb-4">Task Manager Board</h1>

    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <span th:text="${task.id == null ? 'Add New Task' : 'Edit Task'}"></span>
        </div>
        <div class="card-body">
            <form th:action="@{/save}" th:object="${task}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input class="form-control" th:field="*{title}" placeholder="Enter title" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" th:field="*{description}" placeholder="Enter description"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select class="form-select" th:field="*{status}">
                        <option value="TO_DO">TO_DO</option>
                        <option value="IN_PROGRESS">IN_PROGRESS</option>
                        <option value="DONE">DONE</option>
                    </select>
                </div>

                <button class="btn btn-primary" type="submit">Save</button>
                <a href="/" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>

    <div class="row g-3">

        <div class="col-md-4">
            <div class="card shadow-sm mb-3">
                <div class="card-header bg-primary text-white text-center">To Do</div>
                <div class="card-body" style="min-height: 300px;">
                    <div th:each="t : ${tasks}" th:if="${t.status.name() == 'TO_DO'}" class="card mb-2">
                        <div class="card-body p-2">
                            <h6 th:text="${t.title}"></h6>
                            <p th:text="${t.description}"></p>
                            <div class="d-flex justify-content-between">
                                <span class="badge bg-primary text-white" th:text="${t.status.name()}"></span>
                                <div>
                                    <a th:href="@{'/edit/' + ${t.id}}" class="btn btn-sm btn-warning">Edit</a>
                                    <a th:href="@{'/delete/' + ${t.id}}" class="btn btn-sm btn-danger"
                                       onclick="return confirm('Delete this task?')">Delete</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm mb-3">
                <div class="card-header bg-warning text-dark text-center">In Progress</div>
                <div class="card-body" style="min-height: 300px;">
                    <div th:each="t : ${tasks}" th:if="${t.status.name() == 'IN_PROGRESS'}" class="card mb-2">
                        <div class="card-body p-2">
                            <h6 th:text="${t.title}"></h6>
                            <p th:text="${t.description}"></p>
                            <div class="d-flex justify-content-between">
                                <span class="badge bg-warning text-dark" th:text="${t.status.name()}"></span>
                                <div>
                                    <a th:href="@{'/edit/' + ${t.id}}" class="btn btn-sm btn-warning">Edit</a>
                                    <a th:href="@{'/delete/' + ${t.id}}" class="btn btn-sm btn-danger"
                                       onclick="return confirm('Delete this task?')">Delete</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm mb-3">
                <div class="card-header bg-success text-white text-center">Done</div>
                <div class="card-body" style="min-height: 300px;">
                    <div th:each="t : ${tasks}" th:if="${t.status.name() == 'DONE'}" class="card mb-2">
                        <div class="card-body p-2">
                            <h6 th:text="${t.title}"></h6>
                            <p th:text="${t.description}"></p>
                            <div class="d-flex justify-content-between">
                                <span class="badge bg-success text-white" th:text="${t.status.name()}"></span>
                                <div>
                                    <a th:href="@{'/edit/' + ${t.id}}" class="btn btn-sm btn-warning">Edit</a>
                                    <a th:href="@{'/delete/' + ${t.id}}" class="btn btn-sm btn-danger"
                                       onclick="return confirm('Delete this task?')">Delete</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const body = document.getElementById('body');
        const toggleButton = document.querySelector('.dark-mode-toggle');

        // Inițializează modul din localStorage
        if(localStorage.getItem('darkMode') === 'true') {
            body.classList.add('dark-mode');
        } else {
            body.classList.remove('dark-mode');
        }

        // Funcția toggle globală
        toggleButton.addEventListener('click', function() {
            body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', body.classList.contains('dark-mode'));
        });
    });
</script>

</body>
</html>
