<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            color: #1f1f1f;
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #1f1f1f, #2c2c2c);
            color: #f0f0f0;
        }

        .dark-mode .card {
            background-color: #2c2c2c;
            color: #f0f0f0;
        }

        .dark-mode .table {
            color: #f0f0f0;
        }

        .dark-mode .table-striped > tbody > tr:nth-of-type(odd) {
            background-color: #3a3a3a;
        }

        .dark-mode .btn-primary {
            background-color: #ffcc00;
            color: #1f1f1f;
            border-color: #ffcc00;
        }

        .dark-mode .btn-primary:hover {
            background-color: #e6b800;
            color: #1f1f1f;
        }

        .dark-mode .btn-secondary {
            background-color: #555;
            color: #f0f0f0;
            border-color: #555;
        }

        .dark-mode .btn-warning {
            background-color: #ffcc00;
            color: #1f1f1f;
            border-color: #ffcc00;
        }

        .dark-mode .btn-danger {
            background-color: #ff4d4d;
            color: #fff;
            border-color: #ff4d4d;
        }

        .dark-mode-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            z-index: 9999;
        }

        .card {
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: background-color 0.3s, color 0.3s;
        }

        .card-header {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .btn {
            border-radius: 8px;
        }
    </style>
</head>
<body id="body">

<button class="dark-mode-toggle btn btn-warning" onclick="toggleDarkMode()">🌙 Toggle Dark Mode</button>

<div class="container mt-5">

    <h1 class="text-center mb-4">Task Manager</h1>

    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <span th:text="${task.id == null ? 'Add New Task' : 'Edit Task'}"></span>
        </div>
        <div class="card-body">
            <form th:action="@{/save}" th:object="${task}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input class="form-control" th:field="*{title}" placeholder="Enter title" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" th:field="*{description}" placeholder="Enter description"></textarea>
                </div>

                <button class="btn btn-primary" type="submit">Save</button>
                <a href="/" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>

    <!-- All Tasks Table -->
    <div class="card shadow-sm">
        <div class="card-header">
            All Tasks
        </div>
        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Description</th>
                    <th style="width: 180px">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${tasks}">
                    <td th:text="${t.id}"></td>
                    <td th:text="${t.title}"></td>
                    <td th:text="${t.description}"></td>
                    <td>
                        <a th:href="@{'/edit/' + ${t.id}}" class="btn btn-sm btn-warning">Edit</a>
                        <a th:href="@{'/delete/' + ${t.id}}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Delete this task?')">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
    const body = document.getElementById('body');

    if(localStorage.getItem('darkMode') === 'true') {
        body.classList.add('dark-mode');
    }

    function toggleDarkMode() {
        body.classList.toggle('dark-mode');
        localStorage.setItem('darkMode', body.classList.contains('dark-mode'));
    }
</script>

</body>
</html>
