<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-4">Task Manager</h1>

    <!-- ADD / EDIT FORM -->
    <div class="card shadow-sm">
        <div class="card-header">
            <span th:text="${task.id == null ? 'Add new task' : 'Edit task'}"></span>
        </div>

        <div class="card-body">

            <form th:action="@{/save}" th:object="${task}" method="post">

                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input class="form-control" th:field="*{title}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" th:field="*{description}"></textarea>
                </div>

                <button class="btn btn-primary" type="submit">Save</button>
                <a href="/" class="btn btn-secondary">Cancel</a>

            </form>

        </div>
    </div>

    <!-- LIST -->
    <div class="card shadow-sm mt-4">
        <div class="card-header">
            All tasks
        </div>

        <table class="table table-striped mb-0">
            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th style="width: 150px">Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="t : ${tasks}">
                <td th:text="${t.id}"></td>
                <td th:text="${t.title}"></td>
                <td th:text="${t.description}"></td>

                <td>
                    <a th:href="@{'/edit/' + ${t.id}}" class="btn btn-sm btn-warning">Edit</a>
                    <a th:href="@{'/delete/' + ${t.id}}"
                       class="btn btn-sm btn-danger"
                       onclick="return confirm('Delete this task?')">
                        Delete
                    </a>
                </td>
            </tr>
            </tbody>

        </table>
    </div>

</div>

</body>
</html>
